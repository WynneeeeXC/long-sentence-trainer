{% extends "base.html" %}
{% block title %}出题 · Wynneeee's training{% endblock %}
{% block content %}
<h1>练习出题</h1>
<p class="sub">短语级：英选中 / 英译中听写 / 中译英造句；句子级：英译中（考研翻译题）。手写题提交后 AI 一针见血点评。</p>

<div class="tabs">
  <div class="tab on" data-m="mix">混合</div>
  <div class="tab" data-m="match">英选中文</div>
  <div class="tab" data-m="dictation">英译中听写</div>
  <div class="tab" data-m="recall">中译英造句</div>
  <div class="tab" data-m="sentence">英译中（句子）</div>
</div>

<div class="card" id="quiz-start">
  <p class="mut">短语题从短语本随机抽 5 个；句子题从句子库随机抽 5 句（需已有 AI 整句翻译）。</p>
  <button class="btn primary" onclick="startQuiz()">开始出题</button>
  <span id="quiz-empty" style="display:none" class="mut">题库还空着，先去 <a href="/">分析句子</a> 收录吧。</span>
</div>

<div id="quiz-body" style="display:none">
  <div class="card">
    <div class="mut" id="quiz-progress"></div>
    <div class="block" id="quiz-q"></div>
    <div id="quiz-input"></div>
    <div id="quiz-feedback" style="margin-top:12px"></div>
    <div style="margin-top:14px;text-align:right">
      <button class="btn primary" id="btn-ok" style="display:none" onclick="confirmAnswer()">确认</button>
      <button class="btn ghost" id="btn-next-q" style="display:none" onclick="nextQ()">下一题 →</button>
    </div>
  </div>
</div>

<div class="card" id="quiz-result" style="display:none">
  <h3>本轮结果</h3>
  <div id="result-detail"></div>
  <div style="margin-top:14px">
    <button class="btn primary" onclick="startQuiz()">再来一轮</button>
  </div>
</div>

<script>
let mode = 'mix', questions = [], idx = 0, score = 0, answered = [];
let qtype = 'match';   // 当前题的实际题型

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    mode = t.dataset.m;
  });
});

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

async function startQuiz(){
  if(mode === 'sentence'){
    const d = await (await fetch('/api/quiz/sentence?n=5')).json();
    if(!d.ok){ document.getElementById('quiz-empty').style.display = ''; return; }
    questions = d.questions; idx = 0; score = 0; answered = [];
    document.getElementById('quiz-start').style.display = 'none';
    document.getElementById('quiz-body').style.display = '';
    document.getElementById('quiz-result').style.display = 'none';
    showQ();
    return;
  }
  const d = await (await fetch('/api/quiz?n=5')).json();
  if(!d.ok){ document.getElementById('quiz-empty').style.display = ''; return; }
  questions = d.questions; idx = 0; score = 0; answered = [];
  document.getElementById('quiz-start').style.display = 'none';
  document.getElementById('quiz-body').style.display = '';
  document.getElementById('quiz-result').style.display = 'none';
  showQ();
}

function pickType(){
  if(mode !== 'mix') return mode;
  const roll = Math.random();
  if(roll < 0.4) return 'match';
  if(roll < 0.7) return 'dictation';
  return 'recall';
}

function typeName(t){
  return ({match:'英选中文', dictation:'英译中听写', recall:'中译英造句', sentence:'英译中（句子）'})[t];
}

function showQ(){
  const q = questions[idx];
  qtype = mode === 'sentence' ? 'sentence' : pickType();
  document.getElementById('quiz-progress').textContent = '第 ' + (idx + 1) + ' / ' + questions.length + ' 题 · 题型：' + typeName(qtype);
  const qb = document.getElementById('quiz-q');
  const inputBox = document.getElementById('quiz-input');
  const fb = document.getElementById('quiz-feedback');
  fb.innerHTML = '';
  document.getElementById('btn-ok').style.display = 'none';
  document.getElementById('btn-next-q').style.display = 'none';

  if(qtype === 'match'){
    qb.innerHTML = '<div class="block-title">下面哪个中文意思对应：<strong>' + esc(q.en) + '</strong></div>'
      + (q.context ? '<div class="mut">出处：' + esc(q.context) + '</div>' : '');
    inputBox.innerHTML = '';
    (q.options || []).forEach(opt => {
      const b = document.createElement('button');
      b.className = 'rating-btn';
      b.style.display = 'block';
      b.style.width = '100%';
      b.style.textAlign = 'left';
      b.style.marginBottom = '8px';
      b.textContent = opt;
      b.onclick = () => pickMatch(opt, q, b);
      inputBox.appendChild(b);
    });
  } else if(qtype === 'dictation'){
    qb.innerHTML = '<div class="block-title">听写：写出下面表达的中文意思</div><div class="sentence-stem">' + esc(q.en) + '</div>'
      + (q.context ? '<div class="mut" style="margin-top:8px">出处：' + esc(q.context) + '</div>' : '');
    inputBox.innerHTML = '<textarea id="write-ans" placeholder="写出中文翻译…" style="min-height:64px"></textarea>';
    document.getElementById('btn-ok').style.display = '';
  } else if(qtype === 'recall'){
    qb.innerHTML = '<div class="block-title">造句：根据中文意思，写出对应的英文表达（最好再造个短句）</div><div class="sentence-stem">' + esc(q.zh) + '</div>';
    inputBox.innerHTML = '<textarea id="write-ans" placeholder="英文表达 + 一个例句…" style="min-height:64px"></textarea>';
    document.getElementById('btn-ok').style.display = '';
  } else { // sentence 英译中（句子级，考研翻译题）
    qb.innerHTML = '<div class="block-title">翻译：把下面这个句子翻译成通顺的中文（考研翻译题）</div><div class="sentence-stem">' + esc(q.en) + '</div>';
    inputBox.innerHTML = '<textarea id="write-ans" placeholder="写出你的中文翻译…" style="min-height:96px"></textarea>';
    document.getElementById('btn-ok').style.display = '';
  }
}

function pickMatch(opt, q, btn){
  const ok = opt === q.answer;
  if(ok) score++;
  answered.push({ q, qtype, answer: opt, ok });
  document.querySelectorAll('#quiz-input .rating-btn').forEach(b => {
    b.disabled = true;
    if(b.textContent === q.answer) b.classList.add('on');
    else if(b === btn && !ok) b.style.opacity = .5;
  });
  showFeedback(q, ok, opt, null);
  document.getElementById('btn-next-q').style.display = '';
}

async function confirmAnswer(){
  const q = questions[idx];
  const my = document.getElementById('write-ans').value.trim();
  if(!my){ alert('先写点什么再确认'); return; }
  const btnOk = document.getElementById('btn-ok');
  btnOk.disabled = true;
  btnOk.textContent = 'AI 点评中…';
  // 手写题交给 AI 点评（dictation/recall/sentence）
  const grade = await (await fetch('/api/quiz/grade', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      direction: qtype === 'recall' ? 'zh2en' : 'en2zh',
      question: qtype === 'recall' ? q.zh : q.en,
      reference: qtype === 'recall' ? (q.en || '') : (q.zh || ''),
      user_answer: my,
    })
  })).json();
  const c = grade.ok ? grade.critique : null;
  const ok = c && (c.score || 0) >= 60;
  if(ok) score++;
  answered.push({ q, qtype, answer: my, ok, score: c ? c.score : 0 });
  showFeedback(q, ok, my, c);
  document.getElementById('btn-next-q').style.display = '';
  btnOk.style.display = 'none';
  btnOk.disabled = false;
  btnOk.textContent = '确认';
}

function showFeedback(q, ok, my, c){
  const fb = document.getElementById('quiz-feedback');
  if(qtype === 'match'){
    fb.innerHTML = '<div class="' + (ok ? 'trans' : 'tips') + '"><strong>' + (ok ? '✓ 对了' : '✗ 对照一下') + '</strong> 你答：' + esc(my || '') + '<br>标准：' + esc(q.answer || '') + '</div>';
    return;
  }
  if(!c){
    fb.innerHTML = '<div class="tips"><strong>对照一下</strong> 你答：' + esc(my || '')
      + '<br>标准：' + esc(qtype === 'recall' ? (q.en || '') : (q.zh || '')) + '</div>';
    return;
  }
  let h = '<div class="' + (ok ? 'trans' : 'tips') + '">';
  h += '<strong>' + (ok ? '✓ 通过（AI 评分 ' + (c.score || 0) + '）' : '✗ 需改进（AI 评分 ' + (c.score || 0) + '）') + '</strong>';
  h += '<div style="margin-top:6px"><b>总评：</b>' + esc(c.verdict || '') + '</div>';
  if(c.problems && c.problems.length){
    h += '<div style="margin-top:6px"><b>问题：</b></div><ul style="margin:4px 0 0 18px">'
      + c.problems.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul>';
  }
  if(c.better){
    h += '<div style="margin-top:6px"><b>更地道的参考答案：</b><br>' + esc(c.better) + '</div>';
  }
  h += '<div class="mut" style="margin-top:6px">你答：' + esc(my || '') + '</div></div>';
  fb.innerHTML = h;
}

function nextQ(){
  idx++;
  if(idx < questions.length) showQ();
  else showResult();
}

function showResult(){
  document.getElementById('quiz-body').style.display = 'none';
  const r = document.getElementById('quiz-result');
  r.style.display = '';
  document.getElementById('result-detail').innerHTML =
    '<div style="font-size:22px;font-weight:700;color:var(--p1)">得分 ' + score + ' / ' + questions.length + '</div>'
    + answered.map(a => {
      const t = typeName(a.qtype);
      const en = a.qtype === 'recall' ? (a.q.zh || '') : (a.q.en || '');
      const ref = a.qtype === 'recall' ? (a.q.en || '') : (a.q.zh || '');
      return '<div class="block"><div>' + t + ' · <strong>' + esc(en) + '</strong></div>'
        + '<div class="mut">你答：' + esc(a.answer) + (a.ok ? ' ✓' : ' ✗ 参考：' + esc(ref)) + '</div></div>';
    }).join('');
}
</script>
{% endblock %}
